kind = "web"
previewPath = "/"
title = "Apex Grid Engineering"
version = "1.0.0"
id = "artifacts/apex-grid"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22130

[services.development]
run = "pnpm --filter @workspace/apex-grid run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/apex-grid", "run", "build" ]
serve = "static"
publicDir = "artifacts/apex-grid/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22130"
BASE_PATH = "/"
