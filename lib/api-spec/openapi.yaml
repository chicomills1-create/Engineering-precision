openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Lead / contact form operations
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: outreach
    description: Authenticated B2B outreach management.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List all leads (admin only)
      responses:
        "200":
          description: All leads, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      operationId: createLead
      tags: [leads]
      summary: Submit a project inquiry / lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /subscribers:
    get:
      operationId: listSubscribers
      tags: [leads]
      summary: List all newsletter subscribers (admin only)
      responses:
        "200":
          description: All subscribers, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscriber"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      operationId: createSubscriber
      tags: [leads]
      summary: Subscribe to the newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriberInput"
      responses:
        "201":
          description: Subscribed (idempotent — repeat emails succeed silently)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscribeResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /subscribers/unsubscribe:
    post:
      operationId: unsubscribeSubscriber
      tags: [leads]
      summary: Unsubscribe an email from the newsletter
      description: Accepts a signed per-subscriber token for one-click links; token is optional for the manual fallback form.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnsubscribeInput"
      responses:
        "200":
          description: Unsubscribed (idempotent — unknown emails succeed silently)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscribeResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /subscribers/{id}:
    delete:
      operationId: deleteSubscriber
      tags: [leads]
      summary: Remove a subscriber (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscribeResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Subscriber not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /callback-chat:
    post:
      operationId: callbackChat
      tags: [leads]
      summary: AI callback assistant chat turn
      description: Sends the visitor's conversation to the AI callback assistant. When name and phone are captured, a callback lead is created and the team is notified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallbackChatInput"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallbackChatReply"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /leads/{id}:
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update a lead's status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdateInput"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /storage/uploads:
    post:
      tags: [Storage]
      operationId: uploadStorageObject
      summary: Upload a file (proxied through the server, which enforces size and type limits)
      parameters:
        - name: x-file-name
          in: header
          required: true
          schema:
            type: string
          description: URI-encoded original filename; extension must be on the server allowlist
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: File stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          description: Missing file, disallowed file type, or invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '413':
          description: File exceeds the upload size limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded file
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /outreach/dashboard:
    get:
      operationId: getOutreachDashboard
      tags: [outreach]
      responses:
        "200": { description: Summary, content: { application/json: { schema: { $ref: "#/components/schemas/OutreachDashboard" } } } }
  /outreach/prospects:
    get:
      operationId: listProspects
      tags: [outreach]
      responses:
        "200": { description: Prospects, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Prospect" } } } } }
    post:
      operationId: createProspect
      tags: [outreach]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProspectInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Prospect" } } } }
  /outreach/prospects/{id}:
    patch:
      operationId: updateProspect
      tags: [outreach]
      parameters: [{ name: id, in: path, required: true, schema: { type: number } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProspectUpdate" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Prospect" } } } }
  /outreach/prospects/{id}/draft:
    post:
      operationId: generateOutreachDraft
      tags: [outreach]
      parameters: [{ name: id, in: path, required: true, schema: { type: number } }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/DraftGenerationInput" } } } }
      responses:
        "201": { description: Drafts created, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OutreachMessage" } } } } }
  /outreach/campaigns:
    get:
      operationId: listCampaigns
      tags: [outreach]
      responses:
        "200": { description: Campaigns, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Campaign" } } } } }
    post:
      operationId: createCampaign
      tags: [outreach]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } }
  /outreach/campaigns/{id}:
    patch:
      operationId: updateCampaign
      tags: [outreach]
      parameters: [{ name: id, in: path, required: true, schema: { type: number } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignUpdate" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } }
  /outreach/messages:
    get:
      operationId: listOutreachMessages
      tags: [outreach]
      responses:
        "200": { description: Messages, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OutreachMessage" } } } } }
    post:
      operationId: createOutreachMessage
      tags: [outreach]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OutreachMessageInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/OutreachMessage" } } } }
  /outreach/messages/{id}:
    patch:
      operationId: updateOutreachMessage
      tags: [outreach]
      parameters: [{ name: id, in: path, required: true, schema: { type: number } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OutreachMessageUpdate" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/OutreachMessage" } } } }
  /outreach/messages/{id}/approve:
    post:
      operationId: approveOutreachMessage
      tags: [outreach]
      parameters: [{ name: id, in: path, required: true, schema: { type: number } }]
      responses:
        "200": { description: Approved, content: { application/json: { schema: { $ref: "#/components/schemas/OutreachMessage" } } } }
  /outreach/messages/{id}/send:
    post:
      operationId: sendOutreachMessage
      tags: [outreach]
      parameters: [{ name: id, in: path, required: true, schema: { type: number } }]
      responses:
        "200": { description: Sent, content: { application/json: { schema: { $ref: "#/components/schemas/OutreachMessage" } } } }
  /outreach/suppressions:
    post:
      operationId: suppressOutreachAddress
      tags: [outreach]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SuppressionInput" } } } }
      responses:
        "201": { description: Suppressed, content: { application/json: { schema: { $ref: "#/components/schemas/Suppression" } } } }
  /outreach/unsubscribe:
    post:
      operationId: unsubscribeOutreachAddress
      tags: [outreach]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OutreachUnsubscribeInput" } } } }
      responses:
        "200": { description: Unsubscribed, content: { application/json: { schema: { $ref: "#/components/schemas/SubscribeResult" } } } }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorMessage:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Lead:
      type: object
      required: [id, name, message, status, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        email:
          type: ["string", "null"]
        company:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        projectType:
          type: ["string", "null"]
        services:
          type: ["string", "null"]
        message:
          type: string
        status:
          $ref: "#/components/schemas/LeadStatus"
        createdAt:
          type: string
    LeadStatus:
      type: string
      enum: [new, contacted, closed]
    LeadUpdateInput:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/LeadStatus"
    Subscriber:
      type: object
      required: [id, email, createdAt]
      properties:
        id:
          type: number
        email:
          type: string
        createdAt:
          type: string
    SubscriberInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          minLength: 5
          maxLength: 320
          pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    UnsubscribeInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          minLength: 5
          maxLength: 320
          pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
        token:
          type: string
          maxLength: 128
          description: Signed unsubscribe token from an email link; verified server-side when present
    SubscribeResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    CallbackChatInput:
      type: object
      required: [messages]
      properties:
        botToken:
          type: string
          maxLength: 4096
          description: Cloudflare Turnstile token, required on the first message of a conversation
        session:
          type: string
          maxLength: 512
          description: Signed chat session stamp returned after successful bot verification
        messages:
          type: array
          maxItems: 30
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string
                minLength: 1
                maxLength: 2000
    CallbackChatReply:
      type: object
      required: [reply, complete]
      properties:
        reply:
          type: string
        complete:
          type: boolean
        session:
          type: string
          description: Signed chat session stamp; echo it back in subsequent messages
    UploadResponse:
      type: object
      required: [objectPath, name]
      properties:
        objectPath:
          type: string
        name:
          type: string
    LeadInput:
      type: object
      required: [name, email, message]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 3
        company:
          type: string
        phone:
          type: string
        projectType:
          type: string
        services:
          type: string
        message:
          type: string
          minLength: 1
        attachments:
          type: array
          description: Object paths of uploaded files attached to the inquiry.
          items:
            type: string
    Prospect:
      type: object
      required: [id, companyName, city, state, audience, fitScore, contactName, contactEmail, emailStatus, status, createdAt, updatedAt]
      properties:
        id: { type: number }
        companyName: { type: string }
        website: { type: [string, "null"] }
        city: { type: string }
        state: { type: string, enum: [AZ, CA, TX] }
        audience: { type: string, enum: [architect, builder] }
        sourceUrl: { type: [string, "null"] }
        researchNotes: { type: [string, "null"] }
        fitScore: { type: number, minimum: 0, maximum: 100 }
        contactName: { type: string }
        contactTitle: { type: [string, "null"] }
        contactEmail: { type: string }
        emailStatus: { type: string, enum: [unverified, verified, invalid] }
        status: { type: string, enum: [new, review, approved, contacted, replied, not_a_fit, suppressed] }
        createdAt: { type: string }
        updatedAt: { type: string }
    ProspectInput:
      type: object
      required: [companyName, city, state, audience, contactName, contactEmail]
      properties:
        companyName: { type: string, minLength: 1 }
        website: { type: string }
        city: { type: string, minLength: 1 }
        state: { type: string, enum: [AZ, CA, TX] }
        audience: { type: string, enum: [architect, builder] }
        sourceUrl: { type: string }
        researchNotes: { type: string }
        fitScore: { type: number, minimum: 0, maximum: 100 }
        contactName: { type: string, minLength: 1 }
        contactTitle: { type: string }
        contactEmail: { type: string, pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$" }
        emailStatus: { type: string, enum: [unverified, verified, invalid] }
        status: { type: string, enum: [new, review, approved, contacted, replied, not_a_fit, suppressed] }
    ProspectUpdate:
      allOf: [{ $ref: "#/components/schemas/ProspectInput" }]
    Campaign:
      type: object
      required: [id, name, audience, states, dailyLimit, status, createdAt, updatedAt]
      properties:
        id: { type: number }
        name: { type: string }
        audience: { type: string, enum: [architect, builder] }
        states: { type: array, items: { type: string, enum: [AZ, CA, TX] } }
        dailyLimit: { type: number, minimum: 1, maximum: 100 }
        status: { type: string, enum: [draft, active, paused] }
        subjectTemplate: { type: [string, "null"] }
        bodyTemplate: { type: [string, "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
    CampaignInput:
      type: object
      required: [name, audience, states]
      properties:
        name: { type: string, minLength: 1 }
        audience: { type: string, enum: [architect, builder] }
        states: { type: array, minItems: 1, items: { type: string, enum: [AZ, CA, TX] } }
        dailyLimit: { type: number, minimum: 1, maximum: 100, default: 10 }
        status: { type: string, enum: [draft, active, paused] }
        subjectTemplate: { type: string }
        bodyTemplate: { type: string }
    CampaignUpdate:
      allOf: [{ $ref: "#/components/schemas/CampaignInput" }]
    OutreachMessage:
      type: object
      required: [id, prospectId, sequenceNumber, subject, body, status, createdAt, updatedAt]
      properties:
        id: { type: number }
        prospectId: { type: number }
        campaignId: { type: [number, "null"] }
        sequenceNumber: { type: number, minimum: 1 }
        subject: { type: string }
        body: { type: string }
        status: { type: string, enum: [draft, approved, sent, delivered, bounced, replied, unsubscribed, failed] }
        scheduledAt: { type: [string, "null"] }
        sentAt: { type: [string, "null"] }
        providerMessageId: { type: [string, "null"] }
        error: { type: [string, "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
    OutreachMessageInput:
      type: object
      required: [prospectId, sequenceNumber, subject, body]
      properties:
        prospectId: { type: number }
        campaignId: { type: number }
        sequenceNumber: { type: number, minimum: 1 }
        subject: { type: string, minLength: 1 }
        body: { type: string, minLength: 1 }
        status: { type: string, enum: [draft, approved] }
        scheduledAt: { type: string }
    OutreachMessageUpdate:
      allOf: [{ $ref: "#/components/schemas/OutreachMessageInput" }]
    DraftGenerationInput:
      type: object
      properties:
        campaignId: { type: number }
    Suppression:
      type: object
      required: [id, email, reason, createdAt]
      properties:
        id: { type: number }
        email: { type: string }
        reason: { type: string }
        createdAt: { type: string }
    SuppressionInput:
      type: object
      required: [email, reason]
      properties:
        email: { type: string, pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$" }
        reason: { type: string, minLength: 1 }
    OutreachUnsubscribeInput:
      type: object
      required: [email, token]
      properties:
        email: { type: string, pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$" }
        token: { type: string, minLength: 1, maxLength: 128 }
    OutreachDashboard:
      type: object
      required: [prospects, campaigns, messages, sentToday, replies]
      properties:
        prospects: { type: number }
        campaigns: { type: number }
        messages: { type: number }
        sentToday: { type: number }
        replies: { type: number }
