components:
  schemas:
    InventoryImportReport:
      type: object
      required: [batchId, sourceRows, importedPendingQualification, excluded, namedImported, publicImported, namedEligible, publicEligible, exclusions]
      properties:
        batchId: { type: string }
        sourceRows: { type: number }
        imported: { type: number }
        importedPendingQualification: { type: number }
        excluded: { type: number }
        namedImported: { type: number }
        publicImported: { type: number }
        namedEligible: { type: number }
        publicEligible: { type: number }
        idempotent: { type: boolean }
        exclusions: { type: object, additionalProperties: { type: number } }
    OutreachLaneConfig:
      type: object
      required: [campaignKey, effectiveMonth, namedLimit, publicLimit, hotMarketLimit, hotLeadLimit]
      properties:
        campaignKey: { type: string }
        effectiveMonth: { type: string }
        namedLimit: { type: number }
        publicLimit: { type: number }
        hotMarketLimit: { type: number }
        hotLeadLimit: { type: number }
    OutreachOneTimeOverrideInput:
      type: object
      required: [campaignKey, requestedForDate, requestedLimit]
      properties:
        campaignKey: { type: string }
        requestedForDate: { type: string, format: date }
        requestedLimit: { type: number, minimum: 1 }
        reason: { type: string }
    OutreachOneTimeOverride:
      type: object
      required: [campaignKey, requestedForDate, requestedLimit, requestedBy, status, expiresAt]
      properties:
        campaignKey: { type: string }
        requestedForDate: { type: string, format: date }
        requestedLimit: { type: number }
        requestedBy: { type: string }
        status: { type: string, enum: [requested, blocked] }
        decisionEvidence: { type: string }
        expiresAt: { type: string, format: date-time }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorMessage:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Lead:
      type: object
      required: [id, name, message, status, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        email:
          type: ["string", "null"]
        company:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        projectType:
          type: ["string", "null"]
        services:
          type: ["string", "null"]
        message:
          type: string
        source: { type: [string, "null"] }
        medium: { type: [string, "null"] }
        campaign: { type: [string, "null"] }
        landingPath: { type: [string, "null"] }
        referrer: { type: [string, "null"] }
        referralPartnerId: { type: [number, "null"] }
        status:
          $ref: "#/components/schemas/LeadStatus"
        createdAt:
          type: string
    LeadStatus:
      type: string
      enum: [new, contacted, closed]
    LeadUpdateInput:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/LeadStatus"
    Subscriber:
      type: object
      required: [id, email, createdAt]
      properties:
        id:
          type: number
        email:
          type: string
        createdAt:
          type: string
    SubscriberInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          minLength: 5
          maxLength: 320
          pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    UnsubscribeInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          minLength: 5
          maxLength: 320
          pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
        token:
          type: string
          maxLength: 128
          description: Signed unsubscribe token from an email link; verified server-side when present
    SubscribeResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    CallbackChatInput:
      type: object
      required: [messages]
      properties:
        botToken:
          type: string
          maxLength: 4096
          description: Cloudflare Turnstile token, required on the first message of a conversation
        session:
          type: string
          maxLength: 512
          description: Signed chat session stamp returned after successful bot verification
        messages:
          type: array
          maxItems: 30
          items:
            type: object
            required: [role, content]
            properties:
              role:
