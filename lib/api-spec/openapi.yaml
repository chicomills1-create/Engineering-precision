openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Lead / contact form operations
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: outreach
    description: Authenticated B2B outreach management.
  - name: client-jobs
    description: Public project intake and authenticated client job history.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List all leads (admin only)
      responses:
        "200":
          description: All leads, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      operationId: createLead
      tags: [leads]
      summary: Submit a project inquiry / lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /subscribers:
    get:
      operationId: listSubscribers
      tags: [leads]
      summary: List all newsletter subscribers (admin only)
      responses:
        "200":
          description: All subscribers, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscriber"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      operationId: createSubscriber
      tags: [leads]
      summary: Subscribe to the newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriberInput"
      responses:
        "201":
          description: Subscribed (idempotent — repeat emails succeed silently)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscribeResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /subscribers/unsubscribe:
    post:
      operationId: unsubscribeSubscriber
      tags: [leads]
      summary: Unsubscribe an email from the newsletter
      description: Accepts a signed per-subscriber token for one-click links; token is optional for the manual fallback form.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnsubscribeInput"
      responses:
        "200":
          description: Unsubscribed (idempotent — unknown emails succeed silently)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscribeResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /subscribers/{id}:
    delete:
      operationId: deleteSubscriber
      tags: [leads]
      summary: Remove a subscriber (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscribeResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Subscriber not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /callback-chat:
    post:
      operationId: callbackChat
      tags: [leads]
      summary: AI callback assistant chat turn
      description: Sends the visitor's conversation to the AI callback assistant. When name and phone are captured, a callback lead is created and the team is notified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallbackChatInput"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallbackChatReply"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /leads/{id}:
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update a lead's status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdateInput"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteLead
      tags: [leads]
      summary: Remove a lead inquiry (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscribeResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /client/jobs:
    get:
      operationId: listClientJobs
      tags: [client-jobs]
      summary: List jobs for the signed-in client company
      responses:
        "200":
          description: Jobs belonging to the signed-in client company
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientJob"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      operationId: createClientJob
      tags: [client-jobs]
      summary: Submit a new project for review
      description: Public submissions are accepted without sign-in. When signed in, the submission is associated with the caller's client company.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientJobInput"
      responses:
        "201":
          description: Project submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientJob"
        "400":
          description: Invalid project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /client/uploads:
    post:
      operationId: uploadClientJobDocument
      tags: [client-jobs]
      summary: Upload a document for a pending client job submission
      parameters:
        - name: x-file-name
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Document uploaded with a one-time claim token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientJobUploadResponse"
        "400":
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "413":
          description: File too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /client/jobs/review:
    get:
      operationId: listClientJobsForReview
      tags: [client-jobs]
      summary: List all client project submissions for internal review
      responses:
        "200":
          description: All project submissions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientJob"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /outreach/client-safe-list:
    get:
      operationId: listClientMonthlySafeList
      tags: [outreach]
      summary: List archived client contacts eligible for monthly outreach
      responses:
        "200":
          description: Deduplicated eligible contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientMonthlySafeListContact"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /outreach/client-monthly-send:
    post:
      operationId: sendClientMonthlyEmail
      tags: [outreach]
      summary: Manually send an approved monthly email to selected safe-list contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientMonthlyEmailInput"
      responses:
        "200":
          description: Per-recipient delivery results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientMonthlyEmailResult"
        "400":
          description: Invalid or ineligible recipients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /client/jobs/{id}:
    patch:
      operationId: updateClientJob
      tags: [client-jobs]
      summary: Update a client project review status or internal note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientJobUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientJob"
        "400":
          description: Invalid update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /client/jobs/{id}/notification-preview:
    post:
      operationId: previewClientJobStatusNotification
      tags: [client-jobs]
      summary: Preview a client project status notification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientJobStatusNotificationInput"
      responses:
        "200":
          description: Client-safe notification preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientJobNotificationPreview"
        "400":
          description: Invalid notification status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /client/jobs/{id}/notification:
    post:
      operationId: sendClientJobStatusNotification
      tags: [client-jobs]
      summary: Update a client project status and send its notification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientJobStatusNotificationInput"
      responses:
        "200":
          description: Updated project; notification failures are recorded in the response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientJob"
        "400":
          description: Invalid notification status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /storage/uploads:
    post:
      tags: [Storage]
      operationId: uploadStorageObject
      summary: Upload a file (proxied through the server, which enforces size and type limits)
      parameters:
        - name: x-file-name
          in: header
          required: true
          schema:
            type: string
          description: URI-encoded original filename; extension must be on the server allowlist
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: File stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          description: Missing file, disallowed file type, or invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '413':
          description: File exceeds the upload size limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded file
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /outreach/dashboard:
    get:
      operationId: getOutreachDashboard
      tags: [outreach]
      responses:
        "200": { description: Summary, content: { application/json: { schema: { $ref: "#/components/schemas/OutreachDashboard" } } } }
  /outreach/prospects:
    get:
      operationId: listProspects
      tags: [outreach]
      responses:
        "200": { description: Prospects, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Prospect" } } } } }
    post:
      operationId: createProspect
      tags: [outreach]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProspectInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Prospect" } } } }
  /outreach/prospects/{id}:
    patch:
      operationId: updateProspect
      tags: [outreach]
      parameters: [{ name: id, in: path, required: true, schema: { type: number } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProspectUpdate" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Prospect" } } } }
  /outreach/prospects/{id}/draft:
    post:
      operationId: generateOutreachDraft
      tags: [outreach]
      parameters: [{ name: id, in: path, required: true, schema: { type: number } }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/DraftGenerationInput" } } } }
      responses:
        "201": { description: Drafts created, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OutreachMessage" } } } } }
  /outreach/prospects/{id}/replied:
    post:
      operationId: markOutreachProspectReplied
      tags: [outreach]
      parameters: [{ name: id, in: path, required: true, schema: { type: number } }]
      responses:
        "200": { description: Prospect marked replied, content: { application/json: { schema: { $ref: "#/components/schemas/Prospect" } } } }
  /outreach/campaigns:
    get:
      operationId: listCampaigns
      tags: [outreach]
      responses:
        "200": { description: Campaigns, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Campaign" } } } } }
    post:
      operationId: createCampaign
      tags: [outreach]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } }
  /outreach/campaigns/{id}:
    patch:
      operationId: updateCampaign
      tags: [outreach]
      parameters: [{ name: id, in: path, required: true, schema: { type: number } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignUpdate" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } }
  /outreach/research-schedules:
    get:
      operationId: listOutreachResearchSchedules
      tags: [outreach]
      responses:
        "200": { description: Scheduled research configuration and latest run status, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ResearchSchedule" } } } } }
  /outreach/campaigns/{id}/research-schedule:
    put:
      operationId: updateOutreachResearchSchedule
      tags: [outreach]
      parameters: [{ name: id, in: path, required: true, schema: { type: number } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ResearchScheduleInput" } } } }
      responses:
        "200": { description: Schedule updated, content: { application/json: { schema: { $ref: "#/components/schemas/ResearchSchedule" } } } }
        "404": { description: Campaign not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorMessage" } } } }
  /outreach/messages:
    get:
      operationId: listOutreachMessages
      tags: [outreach]
      responses:
        "200": { description: Messages, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OutreachMessage" } } } } }
    post:
      operationId: createOutreachMessage
      tags: [outreach]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OutreachMessageInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/OutreachMessage" } } } }
  /outreach/messages/{id}:
    patch:
      operationId: updateOutreachMessage
      tags: [outreach]
      parameters: [{ name: id, in: path, required: true, schema: { type: number } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OutreachMessageUpdate" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/OutreachMessage" } } } }
  /outreach/messages/{id}/approve:
    post:
      operationId: approveOutreachMessage
      tags: [outreach]
      parameters: [{ name: id, in: path, required: true, schema: { type: number } }]
      responses:
        "200": { description: Approved, content: { application/json: { schema: { $ref: "#/components/schemas/OutreachMessage" } } } }
  /outreach/messages/{id}/send:
    post:
      operationId: sendOutreachMessage
      tags: [outreach]
      parameters: [{ name: id, in: path, required: true, schema: { type: number } }]
      responses:
        "200": { description: Sent, content: { application/json: { schema: { $ref: "#/components/schemas/OutreachMessage" } } } }
  /outreach/suppressions:
    post:
      operationId: suppressOutreachAddress
      tags: [outreach]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SuppressionInput" } } } }
      responses:
        "201": { description: Suppressed, content: { application/json: { schema: { $ref: "#/components/schemas/Suppression" } } } }
    get:
      operationId: listOutreachSuppressions
      tags: [outreach]
      responses:
        "200": { description: Suppression records, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Suppression" } } } } }
  /outreach/research-runs:
    get:
      operationId: listOutreachResearchRuns
      tags: [outreach]
      responses:
        "200": { description: Research runs, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ResearchRun" } } } } }
    post:
      operationId: runOutreachResearch
      tags: [outreach]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ResearchRunInput" } } } }
      responses:
        "201": { description: Research run completed, content: { application/json: { schema: { $ref: "#/components/schemas/ResearchRunResponse" } } } }
  /outreach/unsubscribe:
    post:
      operationId: unsubscribeOutreachAddress
      tags: [outreach]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OutreachUnsubscribeInput" } } } }
      responses:
        "200": { description: Unsubscribed, content: { application/json: { schema: { $ref: "#/components/schemas/SubscribeResult" } } } }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorMessage:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Lead:
      type: object
      required: [id, name, message, status, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        email:
          type: ["string", "null"]
        company:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        projectType:
          type: ["string", "null"]
        services:
          type: ["string", "null"]
        message:
          type: string
        status:
          $ref: "#/components/schemas/LeadStatus"
        createdAt:
          type: string
    LeadStatus:
      type: string
      enum: [new, contacted, closed]
    LeadUpdateInput:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/LeadStatus"
    Subscriber:
      type: object
      required: [id, email, createdAt]
      properties:
        id:
          type: number
        email:
          type: string
        createdAt:
          type: string
    SubscriberInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          minLength: 5
          maxLength: 320
          pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    UnsubscribeInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          minLength: 5
          maxLength: 320
          pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
        token:
          type: string
          maxLength: 128
          description: Signed unsubscribe token from an email link; verified server-side when present
    SubscribeResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    CallbackChatInput:
      type: object
      required: [messages]
      properties:
        botToken:
          type: string
          maxLength: 4096
          description: Cloudflare Turnstile token, required on the first message of a conversation
        session:
          type: string
          maxLength: 512
          description: Signed chat session stamp returned after successful bot verification
        messages:
          type: array
          maxItems: 30
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string
                minLength: 1
                maxLength: 2000
    CallbackChatReply:
      type: object
      required: [reply, complete]
      properties:
        reply:
          type: string
        complete:
          type: boolean
        session:
          type: string
          description: Signed chat session stamp; echo it back in subsequent messages
    UploadResponse:
