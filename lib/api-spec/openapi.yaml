openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Lead / contact form operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List all leads (admin only)
      responses:
        "200":
          description: All leads, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      operationId: createLead
      tags: [leads]
      summary: Submit a project inquiry / lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /subscribers:
    get:
      operationId: listSubscribers
      tags: [leads]
      summary: List all newsletter subscribers (admin only)
      responses:
        "200":
          description: All subscribers, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscriber"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      operationId: createSubscriber
      tags: [leads]
      summary: Subscribe to the newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriberInput"
      responses:
        "201":
          description: Subscribed (idempotent — repeat emails succeed silently)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscribeResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /subscribers/unsubscribe:
    post:
      operationId: unsubscribeSubscriber
      tags: [leads]
      summary: Unsubscribe an email from the newsletter
      description: Accepts a signed per-subscriber token for one-click links; token is optional for the manual fallback form.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnsubscribeInput"
      responses:
        "200":
          description: Unsubscribed (idempotent — unknown emails succeed silently)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscribeResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /subscribers/{id}:
    delete:
      operationId: deleteSubscriber
      tags: [leads]
      summary: Remove a subscriber (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscribeResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Subscriber not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /callback-chat:
    post:
      operationId: callbackChat
      tags: [leads]
      summary: AI callback assistant chat turn
      description: Sends the visitor's conversation to the AI callback assistant. When name and phone are captured, a callback lead is created and the team is notified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallbackChatInput"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallbackChatReply"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /leads/{id}:
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update a lead's status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdateInput"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorMessage:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Lead:
      type: object
      required: [id, name, message, status, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        email:
          type: ["string", "null"]
        company:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        projectType:
          type: ["string", "null"]
        services:
          type: ["string", "null"]
        message:
          type: string
        status:
          $ref: "#/components/schemas/LeadStatus"
        createdAt:
          type: string
    LeadStatus:
      type: string
      enum: [new, contacted, closed]
    LeadUpdateInput:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/LeadStatus"
    Subscriber:
      type: object
      required: [id, email, createdAt]
      properties:
        id:
          type: number
        email:
          type: string
        createdAt:
          type: string
    SubscriberInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          minLength: 5
          maxLength: 320
          pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    UnsubscribeInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          minLength: 5
          maxLength: 320
          pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
        token:
          type: string
          maxLength: 128
          description: Signed unsubscribe token from an email link; verified server-side when present
    SubscribeResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    CallbackChatInput:
      type: object
      required: [messages]
      properties:
        botToken:
          type: string
          maxLength: 4096
          description: Cloudflare Turnstile token, required on the first message of a conversation
        session:
          type: string
          maxLength: 512
          description: Signed chat session stamp returned after successful bot verification
        messages:
          type: array
          maxItems: 30
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string
                minLength: 1
                maxLength: 2000
    CallbackChatReply:
      type: object
      required: [reply, complete]
      properties:
        reply:
          type: string
        complete:
          type: boolean
        session:
          type: string
          description: Signed chat session stamp; echo it back in subsequent messages
    LeadInput:
      type: object
      required: [name, email, message]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 3
        company:
          type: string
        phone:
          type: string
        projectType:
          type: string
        services:
          type: string
        message:
          type: string
          minLength: 1
